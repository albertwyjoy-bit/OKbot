version: 1
agent:
  name: ""
  system_prompt_path: ./system.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    # ===== Multi-Agent 工具 =====
    - "kimi_cli.tools.multiagent:Task"           # 启动子 Agent（支持同步/后台）
    - "kimi_cli.tools.multiagent:TaskList"       # 查询任务列表
    - "kimi_cli.tools.multiagent:TaskOutput"     # 查询任务输出
    - "kimi_cli.tools.multiagent:TaskStop"       # 停止后台任务
    # - "kimi_cli.tools.multiagent:CreateSubagent"
    # - "kimi_cli.tools.dmail:SendDMail"
    # - "kimi_cli.tools.think:Think"
    - "kimi_cli.tools.todo:SetTodoList"
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.web:SearchWeb"
    - "kimi_cli.tools.web:FetchURL"
    - "kimi_cli.tools.image_generation:GenerateImage"
    - "kimi_cli.tools.plan:PlanExit"
    # Memory tools (参考 claude-mem 设计)
    - "kimi_cli.tools.memory_tools:SearchMemory"
    - "kimi_cli.tools.memory_tools:TimelineMemory"
    - "kimi_cli.tools.memory_tools:GetObservations"
    - "kimi_cli.tools.memory_tools:SaveMemory"
  subagents:
    coder:
      path: ./sub.yaml
      description: "Good at general software engineering tasks."
